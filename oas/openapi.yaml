openapi: "3.1.0"
info:
  title: Роботы-насекомые
  version: "0.1"
  termsOfService: https://gitlab.bmstu.ru/strpo/samples/robots/-/blob/main/terms.md
  contact:
    name: Фетисов Михаил Вячеславович
    email: fetisov.michael@yandex.ru
externalDocs:
  description: Больше информации тут
  url: https://gitlab.bmstu.ru/strpo/samples/robots/-/tree/main/doc
servers:
  - url: http://robot-insect.local/api/v1
    description: Локальный API робота-насекомого
paths:
  /status:
    description: Текущее состояние робота
    get:
      summary: Получить статус робота
      description: |
        Возвращает текущее состояние робота-насекомого:
        вид, уровень заряда, координаты, скорость, обнаружение вредителя
      responses:
        "200":
          description: Текущий статус робота
          content:
            application/json:
              schema:
                $ref: "schema-robot.yaml#/components/schemas/robot-status"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots:
    description: Управление несколькими роботами
    get:
      summary: Получить список всех роботов
      description: |
        Возвращает статусы всех доступных роботов-насекомых
      responses:
        "200":
          description: Список роботов
          content:
            application/json:
              schema:
                $ref: "schema-robot.yaml#/components/schemas/multiple-robots"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}:
    description: Работа с конкретным роботом
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    get:
      summary: Получить статус конкретного робота
      description: |
        Возвращает статус робота-насекомого по его ID
      responses:
        "200":
          description: Статус робота
          content:
            application/json:
              schema:
                $ref: "schema-robot.yaml#/components/schemas/robot-status"
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}/move:
    description: Управление движением робота
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    post:
      summary: Отправить команду движения
      description: |
        Управление движением робота-насекомого:
        вперёд, назад, поворот, остановка
      requestBody:
        description: Команда движения
        content:
          application/json:
            schema:
              $ref: "schema-robot.yaml#/components/schemas/move-command"
      responses:
        "200":
          description: Команда принята
        "400":
          description: Ошибка в параметрах команды
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Недопустимая команда движения"
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}/route:
    description: Маршрут движения робота
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    get:
      summary: Получить записанный маршрут
      description: |
        Возвращает записанный маршрут движения робота-насекомого
        за указанный период времени
      parameters:
        - name: from
          in: query
          required: false
          description: Начало периода (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2026-05-24T00:00:00Z"
        - name: to
          in: query
          required: false
          description: Конец периода (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2026-05-24T23:59:59Z"
      responses:
        "200":
          description: Маршрут движения
          content:
            application/json:
              schema:
                $ref: "schema-robot.yaml#/components/schemas/route"
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}/camera/photo:
    description: Камера робота
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    get:
      summary: Получить фото с камеры
      description: |
        Возвращает текущее фото с камеры робота-насекомого
      responses:
        "200":
          description: Фото с камеры
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Ошибка камеры"

  /robots/{robotId}/camera/detect:
    description: Обнаружение вредителей
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    post:
      summary: Запустить детекцию вредителя
      description: |
        Анализирует текущее фото с камеры и определяет,
        есть ли на нём вредитель
      responses:
        "200":
          description: Результат обнаружения
          content:
            application/json:
              schema:
                $ref: "schema-robot.yaml#/components/schemas/pest-detection"
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Ошибка детекции"

  /robots/{robotId}/battery:
    description: Состояние батареи
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    get:
      summary: Получить уровень заряда
      description: |
        Возвращает текущий уровень заряда батареи
        и оставшееся время работы
      responses:
        "200":
          description: Данные о батарее
          content:
            application/json:
              schema:
                type: object
                properties:
                  percent:
                    description: Уровень заряда в процентах
                    type: integer
                    example: 85
                  estimated_minutes_left:
                    description: Оставшееся время работы в минутах
                    type: integer
                    example: 180
                  is_charging:
                    description: Находится ли робот на зарядке
                    type: boolean
                    example: false
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}/maintenance/battery:
    description: Обслуживание батареи
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    post:
      summary: Отметить замену батареи
      description: |
        Сообщает системе, что батарея была заменена
      requestBody:
        description: Новая батарея
        content:
          application/json:
            schema:
              type: object
              required:
                - new_battery_id
              properties:
                new_battery_id:
                  description: Идентификатор новой батареи
                  type: string
                  example: "bat-2024-001"
      responses:
        "200":
          description: Батарея отмечена как заменённая
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Timeout"

  /robots/{robotId}/reset:
    description: Сброс настроек
    parameters:
      - name: robotId
        in: path
        required: true
        description: Уникальный идентификатор робота
        schema:
          type: string
        example: "insect-001"
    post:
      summary: Сбросить настройки до заводских
      description: |
        Выполняет сброс всех настроек робота
        к заводским значениям
      responses:
        "200":
          description: Сброс выполнен
        "404":
          description: Робот не найден
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Робот с ID insect-001 не найден"
        "500":
          description: Ошибка сервиса
          content:
            application/json:
              schema:
                type: string
                description: Описание ошибки
                example: "Ошибка сброса настроек"
